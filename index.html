<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Tier List Video Maker</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#141416;color:#eee;font:14px system-ui,sans-serif}
#app{display:grid;grid-template-columns:290px 1fr;height:100vh}
aside{padding:14px;overflow:auto;background:#1c1c20;border-right:1px solid #2c2c32}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8a8a96;margin:18px 0 8px;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}h2:first-child{margin-top:0}h2:hover{color:#b4b4c0}
h2 .ch{margin-left:auto;display:flex;transition:transform .15s}h2.closed .ch{transform:rotate(-90deg)}.sec.closed{display:none}
.lt{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.rs{background:none;border:0;padding:0;width:20px;height:20px;border-radius:5px;color:#8a8a96;display:inline-flex;align-items:center;justify-content:center;flex:none}.rs:hover{background:#2f2f37;color:#fff}.rs.off{visibility:hidden}.rs .i{width:13px;height:13px}
.i{width:16px;height:16px;flex:none}h2 .i{width:15px;height:15px}button[data-ic]{display:inline-flex;align-items:center;gap:7px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;color:#bbb}
input,select,button{font:inherit}input[type=number],select{background:#2a2a30;color:#eee;border:1px solid #3a3a42;border-radius:6px;padding:4px 6px;width:110px}
input[type=range]{width:110px}input[type=color]{width:44px;height:26px;border:0;background:none;padding:0}
button{background:#2f2f37;color:#eee;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{background:#3a3a44}
button.pri{background:#3b82f6}button.pri:hover{background:#5195ff}
main{display:flex;flex-direction:column;padding:14px;gap:12px;overflow:auto}
.stage{background:repeating-conic-gradient(#222 0 25%,#2c2c2c 0 50%) 0 0/24px 24px;border-radius:10px;align-self:center;width:min(100%,calc((100vh - 290px)*1.7778))}
canvas{width:100%;display:block;border-radius:10px}
.rank{display:flex;gap:16px;align-items:center;background:#1c1c20;border-radius:12px;padding:12px}
#dz{width:150px;height:150px;flex:none;border:2px dashed #3a3a46;border-radius:12px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative}#dz.on{border-color:#3b82f6;background:#16213a}#dz.has{cursor:default;border-style:solid;border-color:#2c2c32}#cur{width:100%;height:100%;object-fit:contain}#up{flex-direction:column;align-items:center;gap:6px;text-align:center;color:#aaa;padding:8px}#up svg{width:40px;height:40px;stroke:#3b82f6}
#tb{display:flex;gap:8px;flex-wrap:wrap}#tb button{width:64px;height:64px;font-size:26px;font-weight:700;color:#fff;text-shadow:0 1px 3px #0006}
#tb .tg{display:flex;gap:2px;margin-right:8px}#tb .tg button{width:46px;height:64px;font-size:17px;border-radius:7px}
.rg{display:flex;align-items:center;gap:6px;flex:none}.rg input[type=range]{width:72px}.rg .rv{width:58px}
#nm{background:#2a2a30;color:#fff;border:1px solid #3a3a42;border-radius:6px;padding:6px;width:100%;margin-bottom:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}small{color:#8a8a96}#pgw{display:none;width:100%;align-items:center;gap:10px}#pg{flex:1;height:10px;accent-color:#3b82f6}
</style></head><body><div id="app">
<aside>
<h2 data-ic="image">Items</h2>
<input type="file" id="files" multiple accept="image/*" hidden>
<div class="bar"><button class="pri" data-ic="upload" onclick="files.click()">Importer des images</button><button data-ic="trash" onclick="resetAll()">Vider</button></div>
<small id="count">Aucun item</small>
<h2 data-ic="list">Classement</h2>
<label>Sous-niveaux (+ / −)<input type="checkbox" data-k="sub"></label>
<h2 data-ic="palette">Couleurs</h2><div id="cols"></div>
<label>Fond<input type="color" data-k="bg"></label>
<label>Fond transparent (export)<input type="checkbox" data-k="transp"></label>
<h2 data-ic="monitor">Format</h2>
<label>Résolution<select data-k="h" data-num="1"><option value="1080">1920×1080</option><option value="1440">2560×1440</option><option value="2160">3840×2160</option></select></label>
<label>Images/s<select data-k="fps" data-num="1"><option>24</option><option>25</option><option>30</option><option>60</option></select></label>
<label>Image<select data-k="fit"><option value="cover">Remplir (rogner)</option><option value="contain">Entière</option></select></label>
<label>Qualité vidéo<select data-k="q" data-num="1"><option value="20">Standard (20 Mb/s)</option><option value="50">Haute (50 Mb/s)</option><option value="100">Maximale (100 Mb/s)</option></select></label>
<label>Afficher les noms<input type="checkbox" data-k="names"></label>
<h2 data-ic="clock">Rythme</h2>
<label>Vitesse globale<input type="range" min=".5" max="2.5" step=".05" data-k="speed"></label>
<label>Attente entre items (s)<input type="range" min="0" max="5" step=".1" data-k="wait"></label>
<label>Apparition (s)<input type="range" min=".1" max="1.2" step=".05" data-k="a"></label>
<label>Pause révélation (s)<input type="range" min=".1" max="1.5" step=".05" data-k="h"></label>
<label>Déplacement (s)<input type="range" min=".2" max="1.5" step=".05" data-k="f"></label>
<label>Éclat final (s)<input type="range" min=".1" max="1.5" step=".05" data-k="g"></label>
<label>Obscurité du fond<input type="range" min="0" max="1" step=".05" data-k="dim"></label>
<label>Durée version finale (s)<input type="number" min="1" max="30" data-k="finalDur" data-num="1"></label>
<label>Son à l'aperçu<input type="checkbox" data-k="sound"></label>
<label>Animer en classant<input type="checkbox" data-k="live"></label>
</aside>
<main>
<div class="stage"><canvas id="cv"></canvas></div>
<div class="rank"><div id="dz" onclick="if(!queue().length)files.click()"><img id="cur" alt=""><div id="up"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg><b>Téléverser</b><small>cliquer ou glisser<br>des images ici</small></div></div><div style="flex:1"><input id="nm" placeholder="Nom"><div id="tb"></div>
<small id="hint"></small></div></div>
<div class="bar">
<select id="mode" style="width:auto"><option value="full">Animation complète</option><option value="single">Un seul item</option><option value="final">Version finale</option></select>
<select id="kSel" style="width:auto"></select>
<button class="pri" data-ic="play" onclick="preview()">Aperçu</button>
<button data-ic="image" onclick="exportPNG()">Export PNG (alpha)</button>
<button data-ic="film" onclick="exportVideo()">Export vidéo (.mp4)</button>
<button data-ic="save" onclick="saveRank()">Sauvegarder le projet</button>
<button data-ic="folder" onclick="loadIn.click()">Ouvrir un projet (.json)</button>
<input type="file" id="loadIn" accept=".json,.tierlist" hidden>
<div id="pgw"><progress id="pg" max="1" value="0"></progress><b id="pgt">0 %</b></div><small id="status"></small></div>
</main></div>

 $('#cur').src=c?c.url:'';$('#cur').style.display=c?'block':'none';$('#up').style.display=c?'none':'flex';$('#dz').classList.toggle('has',!!c);$('#nm').value=c?c.name:'';$('#nm').disabled=!c;
 $('#kSel').innerHTML=st.pl.map((p,i)=>`<option value="${i}">${i+1}. ${byId(p.id).name} (${p.lbl||TN[p.tier]})</option>`).join('');$('#kSel').value=st.pl.length-1}
$('#nm').oninput=e=>{const c=queue()[0];if(c)c.name=e.target.value};
function place(t,pos){const c=queue()[0];if(!c)return;pos=cfg.sub?(pos||'mid'):'end';arm=null;hint();
 st.pl.push({id:c.id,tier:t,pos,lbl:TN[t]+(cfg.sub?{start:'+',mid:'',end:'−'}[pos]:'')});ui();window.__exp=false;cfg.live?play('single',st.pl.length-1):idle()}
function undo(){if(st.pl.pop()){ui();idle()}}
function skip(){const q=queue();if(q.length>1){const c=q[0];st.items.splice(st.items.indexOf(c),1);st.items.push(c);ui()}}
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'&&e.target.type=='text'||e.target.tagName=='SELECT')return;
 if(cfg.sub&&(e.key=='+'||e.key=='-'||e.key=='−')){e.preventDefault();arm=e.key=='+'?'start':'end';hint();return}
 const i=TN.indexOf(e.key.toUpperCase());if(i>=0&&!e.ctrlKey&&!e.metaKey)place(i,arm||'mid');else if(/^[1-6]$/.test(e.key))place(+e.key-1,arm||'mid');
 else if(e.key=='Backspace'){e.preventDefault();undo()}else if(e.key==' '){e.preventDefault();skip()}else if(e.key=='Escape'){tok++;arm=null;hint();idle()}});
async function addFiles(list){const fs=[...list].filter(f=>f.type.startsWith('image/')).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
 for(const f of fs){status(`Import : ${f.name}`);st.items.push({id:crypto.randomUUID(),file:f.name,name:f.name.replace(/\.[^.]+$/,''),blob:f,bmp:await createImageBitmap(f),url:URL.createObjectURL(f)})}
 status(fs.length?`${fs.length} image(s) importée(s).`:'Aucune image valide.');ui();idle()}
$('#files').onchange=async e=>{await addFiles(e.target.files);e.target.value=''};
['dragenter','dragover'].forEach(ev=>addEventListener(ev,e=>{e.preventDefault();$('#dz').classList.add('on')}));
['dragleave','drop'].forEach(ev=>addEventListener(ev,e=>{e.preventDefault();$('#dz').classList.remove('on')}));
addEventListener('drop',e=>addFiles(e.dataTransfer.files));
function resetAll(){if(!confirm('Vider tous les items et le classement ?'))return;st.items=[];st.pl=[];ui();idle()}
// ---------- projet complet (images + classement), indépendant du style ----------
const toURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function saveRank(){if(!st.items.length)return alert('Rien à sauvegarder.');const parts=['{"v":2,"items":['];
 for(let n=0;n<st.items.length;n++){const i=st.items[n];status(`Sauvegarde : image ${n+1}/${st.items.length}…`);prog(n/st.items.length);parts.push((n?',':'')+JSON.stringify({file:i.file,name:i.name,type:i.blob.type,data:await toURL(i.blob)}))}
 prog(.98);status('Écriture du fichier…');parts.push('],"placements":'+JSON.stringify(st.pl.map(p=>({i:st.items.findIndex(x=>x.id==p.id),tier:p.tier,pos:p.pos,lbl:p.lbl})))+'}');
 const d=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');dl(new Blob(parts,{type:'application/json'}),`tierlist-${d}.tierlist.json`);prog(1);status('Projet sauvegardé (images incluses). Rouvre-le avec « Ouvrir un projet ».');setTimeout(()=>prog(null),2500)}
$('#loadIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(x){return alert('Fichier illisible.')}
 tok++;
 if(d.v==2){st.items=[];st.pl=[];for(const x of d.items){const b=await (await fetch(x.data)).blob();st.items.push({id:crypto.randomUUID(),file:x.file,name:x.name,blob:b,bmp:await createImageBitmap(b),url:URL.createObjectURL(b)})}
  d.placements.forEach(p=>{if(st.items[p.i])st.pl.push({id:st.items[p.i].id,tier:p.tier,pos:p.pos||'end',lbl:p.lbl})});status('Projet chargé.')}
 else{let ok=0;(d.items||[]).forEach(x=>{const it=st.items.find(i=>i.file==x.file);if(it)it.name=x.name});st.pl=[];
  (d.placements||[]).forEach(p=>{const it=st.items.find(i=>i.file==p.file);if(it){st.pl.push({id:it.id,tier:p.tier,pos:p.pos||'end',lbl:p.lbl});ok++}});
  if(!ok)alert('Ancien format (classement seul) : importe d\'abord les mêmes images, puis recharge ce fichier. Les nouvelles sauvegardes contiennent les images.');else status(`${ok} classements restaurés.`)}
 ui();idle()};
// ---------- exports ----------
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)};
const status=t=>$('#status').textContent=t;
function prog(v){const w=$('#pgw');if(v==null){w.style.display='none';return}w.style.display='flex';$('#pg').value=v;$('#pgt').textContent=Math.round(v*100)+' %'}
let onProg=null;
async function exportPNG(){if(!window.showDirectoryPicker)return alert('Utilise Chrome ou Edge pour cet export.');
 const m=$('#mode').value,k=+$('#kSel').value||0;if(m!='final'&&!st.pl.length)return;let dir;try{dir=await window.showDirectoryPicker({mode:'readwrite'})}catch(e){return}
 tok++;window.__exp=true;const d=dur(m),n=m=='final'?1:Math.ceil(d*cfg.fps);
 for(let f=0;f<n;f++){render(Math.min(f/cfg.fps,d),m,k);const b=await new Promise(r=>cv.toBlob(r,'image/png')),h=await dir.getFileHandle(`frame_${String(f+1).padStart(5,'0')}.png`,{create:true}),w=await h.createWritable();await w.write(b);await w.close();status(`Export PNG : image ${f+1}/${n}`);prog((f+1)/n)}
 status(`Terminé : ${n} image(s). Premiere : Fichier > Importer, 1re image, cocher « Séquence d'images ».`);prog(1);setTimeout(()=>prog(null),2500);idle()}
// ---------- export vidéo : encodage image par image (WebCodecs) + MP4, hors temps réel ----------
function beepTimes(m){const T=tm(),L=T.a+T.h+T.f;if(m=='full')return st.pl.map((p,k)=>({t:k*(T.D+T.w)+L,tier:p.tier}));if(m=='single'){const p=st.pl[+$('#kSel').value||0];return p?[{t:L,tier:p.tier}]:[]}return[]}
async function renderAudio(list,d,sr){const oc=new OfflineAudioContext(2,Math.ceil(d*sr),sr);
 list.forEach(b=>{const o=oc.createOscillator(),g=oc.createGain();o.type='triangle';o.frequency.value=880-b.tier*90;g.gain.setValueAtTime(.15,b.t);g.gain.exponentialRampToValueAtTime(.001,b.t+.25);o.connect(g).connect(oc.destination);o.start(b.t);o.stop(b.t+.26)});
 return oc.startRendering()}
function wavBlob(buf){const n=buf.length,ch=buf.numberOfChannels,sr=buf.sampleRate,out=new DataView(new ArrayBuffer(44+n*ch*2)),w=(o,t)=>[...t].forEach((c,i)=>out.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');out.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');out.setUint32(16,16,true);out.setUint16(20,1,true);out.setUint16(22,ch,true);out.setUint32(24,sr,true);out.setUint32(28,sr*ch*2,true);out.setUint16(32,ch*2,true);out.setUint16(34,16,true);w(36,'data');out.setUint32(40,n*ch*2,true);
 const d=[...Array(ch)].map((_,i)=>buf.getChannelData(i));let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){out.setInt16(o,Math.max(-1,Math.min(1,d[c][i]))*32767,true);o+=2}return new Blob([out],{type:'audio/wav'})}
function avcCodec(w,h,fps){const mb=Math.ceil(w/16)*Math.ceil(h/16)*fps,lv=[[245760,'28'],[522240,'2a'],[589824,'32'],[983040,'33'],[2073600,'34']].find(x=>mb<=x[0]);return 'avc1.6400'+(lv?lv[1]:'34')}
async function exportVideo(){
 if(!window.VideoEncoder||!window.Mp4Muxer)return alert('WebCodecs indisponible : utilise Chrome ou Edge récent.');
 const m=$('#mode').value,k=+$('#kSel').value||0;if(m!='final'&&!st.pl.length)return;
 const fps=cfg.fps,w=W(),h=cfg.h,d=dur(m),n=Math.max(1,Math.ceil(d*fps)),sr=48000,bps=Math.round(cfg.q*1e6*(w*h/2073600)*Math.sqrt(fps/30));
 const vc={codec:avcCodec(w,h,fps),width:w,height:h,bitrate:bps,framerate:fps,latencyMode:'quality',bitrateMode:'variable'};
 const sup=await VideoEncoder.isConfigSupported(vc);if(!sup.supported)return alert('Cette résolution / ces images par seconde ne sont pas supportées par ton encodeur. Essaie une résolution ou un fps plus bas.');
 const bl=cfg.sound?beepTimes(m):[],ac2={codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:2,bitrate:192000};
 let abuf=null,aac=false;if(bl.length){abuf=await renderAudio(bl,d,sr);aac=!!(window.AudioEncoder&&(await AudioEncoder.isConfigSupported(ac2)).supported)}
 const mux=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:w,height:h,frameRate:fps},audio:aac?{codec:'aac',numberOfChannels:2,sampleRate:sr}:undefined,fastStart:'in-memory'});
 let err=null;const ve=new VideoEncoder({output:(c,md)=>mux.addVideoChunk(c,md),error:e=>err=e});ve.configure(vc);
 tok++;window.__exp=false; // fond opaque (le H.264 n'a pas de transparence)
 try{
  for(let f=0;f<n;f++){if(err)throw err;render(Math.min(f/fps,d),m,k);
   const fr=new VideoFrame(cv,{timestamp:Math.round(f*1e6/fps),duration:Math.round(1e6/fps)});ve.encode(fr,{keyFrame:f%(fps*2)==0});fr.close();
   while(ve.encodeQueueSize>8)await new Promise(r=>setTimeout(r,5));
   if(f%4==0){prog(.9*(f+1)/n);status(`Encodage : image ${f+1}/${n}`);await new Promise(r=>setTimeout(r,0))}}
  status('Finalisation de la vidéo…');await ve.flush();ve.close();
  if(aac){status('Encodage du son…');const ae=new AudioEncoder({output:(c,md)=>mux.addAudioChunk(c,md),error:e=>err=e});ae.configure(ac2);
   const ch0=abuf.getChannelData(0),ch1=abuf.getChannelData(1),N=sr;
   for(let o=0;o<abuf.length;o+=N){const fl=Math.min(N,abuf.length-o),dt=new Float32Array(fl*2);dt.set(ch0.subarray(o,o+fl),0);dt.set(ch1.subarray(o,o+fl),fl);
    const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:fl,numberOfChannels:2,timestamp:Math.round(o/sr*1e6),data:dt});ae.encode(ad);ad.close()}
   await ae.flush();ae.close()}
  if(err)throw err;mux.finalize();prog(.98);
  dl(new Blob([mux.target.buffer],{type:'video/mp4'}),'tierlist.mp4');
  if(abuf&&!aac){dl(wavBlob(abuf),'sons.wav');status('MP4 enregistré SANS son (AAC non supporté par ce navigateur) : sons.wav téléchargé à glisser dans Premiere.')}
  else status(`MP4 enregistré (${(bps/1e6).toFixed(0)} Mb/s${aac?', avec le son':''}).`);
  prog(1);setTimeout(()=>prog(null),2500)
 }catch(e){prog(null);status('Erreur export : '+(e.message||e));try{ve.close()}catch(x){}}
 idle()}
initUI();bindUI();size();idle();ui();
</script></body></html>
